<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מועדון NETABEL - מערכת ניהול והתחשבנות</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PapaParse for robust CSV Handling (Google Sheets compatible) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Heebo', sans-serif; background-color: #0b1120; color: #f8fafc; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .card-gradient { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(255,255,255,0.05); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b1120; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .toast-animate { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .modal-animate { animation: fadeIn 0.2s ease-out forwards; }

        /* Privacy Mode Classes */
        .privacy-on .money-value { filter: blur(6px); transition: filter 0.3s ease; user-select: none; }
        .privacy-on .money-value:hover { filter: blur(0); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        const DEFAULT_CYCLE = "מחזור נוכחי";
        const SYSTEM_EXPENSES_RATE = 0.10; // 10% הוצאות למועדון

        // רשימת משתמשים וסוכנים התחלתית
        const initialUsers = [
            { id: 'admin1', username: 'admin', password: 'X', role: 'admin', name: 'מנהל ראשי' },
            { id: 'agent_default', username: 'unassigned', password: '123', role: 'agent', name: 'שחקנים ללא סוכן', commissionRate: 0 },
            { id: 'agent_otc1', username: 'otc1', password: '123', role: 'agent', name: 'OTC 1', commissionRate: 70 },
            { id: 'agent_amirgu', username: 'amirgu', password: '123', role: 'agent', name: 'AMIRGU', commissionRate: 70 },
            { id: 'agent_naki', username: 'naki', password: '123', role: 'agent', name: 'NAKI', commissionRate: 70 },
            { id: 'agent_oz', username: 'oz', password: '123', role: 'agent', name: 'OZ', commissionRate: 70 },
            { id: 'agent_dopdop', username: 'dopdop', password: '123', role: 'agent', name: 'dop dop', commissionRate: 70 },
        ];

        // --- Utils ---
        const formatMoney = (amount) => {
            if (!amount && amount !== 0) return '₪0.00';
            const num = parseFloat(amount);
            const isNegative = num < 0;
            const absoluteValue = Math.abs(num);
            const formatted = absoluteValue.toLocaleString('he-IL', { style: 'currency', currency: 'ILS' });
            return isNegative ? `-${formatted}` : formatted;
        };

        const getColorClass = (amount, forceGreen = false) => {
            if (forceGreen) return 'text-emerald-400';
            if (!amount || amount === 0) return 'text-slate-400';
            return amount > 0 ? 'text-emerald-400' : 'text-red-400';
        };

        // --- Icons (Inline SVGs) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                users: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
                dashboard: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>,
                message: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>,
                upload: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
                logout: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
                gift: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>,
                chevronDown: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"></polyline></svg>,
                chevronUp: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"></polyline></svg>,
                sort: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="14" y2="12"></line><line x1="4" y1="18" x2="8" y2="18"></line></svg>,
                search: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
                settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
                trash: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
                eye: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
                eyeOff: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>,
                check: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>,
                alert: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
                whatsapp: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
                history: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
                plus: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                userPlus: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>,
                edit: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            };
            return icons[name] || null;
        };

        const Toast = ({ message, type }) => (
            <div className={`fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[100] px-6 py-3 rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.5)] flex items-center gap-3 toast-animate font-bold ${type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                <Icon name={type === 'success' ? 'check' : 'alert'} size={18} />
                {message}
            </div>
        );

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel, confirmText = "אישור", confirmColor = "bg-red-600 hover:bg-red-700" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-animate">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl">
                        <h3 className="text-xl font-bold text-white mb-2">{title}</h3>
                        <p className="text-slate-300 mb-6 leading-relaxed">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-5 py-2 rounded-lg font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors">ביטול</button>
                            <button onClick={onConfirm} className={`px-5 py-2 rounded-lg font-bold text-white transition-colors shadow-lg ${confirmColor}`}>{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [records, setRecords] = useState([]);
            const [messages, setMessages] = useState([]);
            const [currentCycle, setCurrentCycle] = useState(DEFAULT_CYCLE);
            const [cyclesList, setCyclesList] = useState([DEFAULT_CYCLE]);
            const [uploadBatches, setUploadBatches] = useState([]); 
            const [toast, setToast] = useState(null);
            const [isPrivacyMode, setIsPrivacyMode] = useState(false);

            useEffect(() => {
                const storedUsers = JSON.parse(localStorage.getItem('netabel_sys_v11_users'));
                const storedRecords = JSON.parse(localStorage.getItem('netabel_sys_v11_records'));
                const storedMessages = JSON.parse(localStorage.getItem('netabel_sys_v11_messages'));
                const storedCycles = JSON.parse(localStorage.getItem('netabel_sys_v11_cycles'));
                const storedUploads = JSON.parse(localStorage.getItem('netabel_sys_v11_uploads'));
                
                if (storedUsers) setUsers(storedUsers); else setUsers(initialUsers);
                if (storedRecords) setRecords(storedRecords); else setRecords([]);
                if (storedMessages) setMessages(storedMessages); else setMessages([]);
                if (storedCycles) setCyclesList(storedCycles); else setCyclesList([DEFAULT_CYCLE]);
                if (storedUploads) setUploadBatches(storedUploads); else setUploadBatches([]);
            }, []);

            useEffect(() => {
                if(users.length > 0) {
                    localStorage.setItem('netabel_sys_v11_users', JSON.stringify(users));
                    localStorage.setItem('netabel_sys_v11_records', JSON.stringify(records));
                    localStorage.setItem('netabel_sys_v11_messages', JSON.stringify(messages));
                    localStorage.setItem('netabel_sys_v11_cycles', JSON.stringify(cyclesList));
                    localStorage.setItem('netabel_sys_v11_uploads', JSON.stringify(uploadBatches));
                }
            }, [users, records, messages, cyclesList, uploadBatches]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const login = (username, password) => {
                const user = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
                if (user) {
                    setCurrentUser(user);
                    showToast(`ברוך הבא למערכת, ${user.name || user.username}`);
                } else {
                    showToast('שם משתמש או סיסמה שגויים', 'error');
                }
            };

            if (!currentUser) {
                return (
                    <div className="relative">
                        <LoginScreen onLogin={login} />
                        {toast && <Toast message={toast.message} type={toast.type} />}
                    </div>
                );
            }

            return (
                <div className={`min-h-screen flex flex-col text-slate-100 bg-[#0b1120] relative overflow-x-hidden ${isPrivacyMode ? 'privacy-on' : ''}`}>
                    <TopNavBar user={currentUser} logout={() => setCurrentUser(null)} currentCycle={currentCycle} setCurrentCycle={setCurrentCycle} cyclesList={cyclesList} isPrivacyMode={isPrivacyMode} setIsPrivacyMode={setIsPrivacyMode} />
                    <GlobalStatsHeader user={currentUser} users={users} records={records.filter(r => r.cycleId === currentCycle)} />
                    
                    <main className="flex-1 w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
                        {currentUser.role === 'admin' && (
                            <AdminDashboard 
                                users={users} setUsers={setUsers} records={records} setRecords={setRecords}
                                messages={messages} setMessages={setMessages} currentCycle={currentCycle} 
                                cyclesList={cyclesList} setCyclesList={setCyclesList} showToast={showToast}
                                uploadBatches={uploadBatches} setUploadBatches={setUploadBatches}
                            />
                        )}
                        {currentUser.role === 'agent' && (
                            <AgentDashboard user={currentUser} users={users} records={records} currentCycle={currentCycle} showToast={showToast} />
                        )}
                        {currentUser.role === 'player' && (
                            <PlayerDashboard user={currentUser} records={records} messages={messages} currentCycle={currentCycle} />
                        )}
                    </main>
                    {toast && <Toast message={toast.message} type={toast.type} />}
                </div>
            );
        };

        const TopNavBar = ({ user, logout, currentCycle, setCurrentCycle, cyclesList, isPrivacyMode, setIsPrivacyMode }) => (
            <nav className="glass-panel sticky top-0 z-40">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
                    <div className="flex items-center gap-4">
                        <div className="flex-shrink-0 text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 flex items-center gap-2">
                            <div className="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500/50">
                                <span className="text-emerald-400 text-lg">♠</span>
                            </div>
                            NETABEL
                        </div>
                        <div className="ml-8 border-r border-slate-700 pr-4">
                            <select value={currentCycle} onChange={(e) => setCurrentCycle(e.target.value)} className="bg-slate-800 text-sm font-medium rounded border border-slate-600 px-3 py-1.5 text-white outline-none focus:border-emerald-500 cursor-pointer shadow-sm">
                                {cyclesList.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                    </div>
                    <div className="flex items-center gap-4">
                        <button onClick={() => setIsPrivacyMode(!isPrivacyMode)} className={`p-2 rounded-lg transition-colors ${isPrivacyMode ? 'bg-cyan-900/50 text-cyan-400 border border-cyan-500/30' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`} title="מצב פרטיות (הסתרת כספים)">
                            <Icon name={isPrivacyMode ? 'eyeOff' : 'eye'} size={20} />
                        </button>
                        <div className="text-right hidden sm:block leading-tight border-r border-slate-700 pr-4">
                            <div className="text-sm font-bold text-slate-200">{user.name || user.username}</div>
                            <div className="text-[10px] text-emerald-400 uppercase tracking-wider font-semibold">
                                {user.role === 'admin' ? 'מנהל מערכת' : user.role === 'agent' ? 'סוכן' : 'שחקן'}
                            </div>
                        </div>
                        <button onClick={logout} className="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="התנתק">
                            <Icon name="logout" size={20} />
                        </button>
                    </div>
                </div>
            </nav>
        );

        const GlobalStatsHeader = ({ user, users, records }) => {
            if (user.role === 'player') return null;

            const players = users.filter(u => u.role === 'player');
            const agents = users.filter(u => u.role === 'agent');

            let headerTitle = "סיכום מועדון (אדמין)";
            let displayPnL = 0;
            let displayCommission = 0;
            let activePlayers = 0;

            if (user.role === 'admin') {
                displayPnL = records.reduce((sum, r) => sum + (r.pnl || 0), 0);
                activePlayers = records.length;
                records.forEach(r => {
                    const player = players.find(p => p.id === r.playerId);
                    if (player) {
                        const agent = agents.find(a => a.id === player.agentId);
                        const rate = (player.customCommission !== null && player.customCommission !== undefined && player.customCommission !== '') ? Number(player.customCommission) : (agent?.commissionRate || 0);
                        const netRake = r.rake * (1 - SYSTEM_EXPENSES_RATE);
                        displayCommission += netRake * (rate / 100);
                    }
                });
            } else if (user.role === 'agent') {
                headerTitle = "הנתונים שלי (סוכן)";
                const myPlayers = players.filter(p => p.agentId === user.id).map(p => p.id);
                const myRecords = records.filter(r => myPlayers.includes(r.playerId));
                activePlayers = myRecords.length;
                
                myRecords.forEach(r => {
                    const player = players.find(p => p.id === r.playerId);
                    const rate = (player.customCommission !== null && player.customCommission !== undefined && player.customCommission !== '') ? Number(player.customCommission) : user.commissionRate;
                    
                    const playerPnl = r.pnl + (r.bonus || 0);
                    const netRake = r.rake * (1 - SYSTEM_EXPENSES_RATE);
                    const agentComm = netRake * (rate / 100);
                    
                    displayPnL += playerPnl;
                    displayCommission += agentComm;
                });
            }

            const totalAgainstClub = displayPnL + displayCommission;

            return (
                <div className="bg-slate-900 border-b border-slate-800 py-4 px-4 sm:px-6 lg:px-8 shadow-inner relative z-30">
                    <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div className="text-slate-400 text-sm font-medium tracking-wide flex items-center gap-2">
                            <Icon name="dashboard" size={16}/>
                            {headerTitle} <span className="text-slate-600">|</span> רשומות פעילות: <span className="text-white">{activePlayers}</span>
                        </div>
                        <div className="flex flex-wrap gap-4 sm:gap-8">
                            <div className="text-right bg-slate-800/50 px-4 py-2 rounded-lg border border-slate-700/50">
                                <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">תוצאת שחקנים כללית</div>
                                <div className={`text-xl font-black money-value ${getColorClass(displayPnL)}`}>{formatMoney(displayPnL)}</div>
                            </div>
                            <div className="text-right bg-slate-800/50 px-4 py-2 rounded-lg border border-slate-700/50">
                                <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">{user.role === 'admin' ? "סה\"כ עמלות ששולמו" : "העמלה שלי (נטו)"}</div>
                                <div className="text-xl font-black text-emerald-400 money-value">{formatMoney(displayCommission)}</div>
                            </div>
                            {user.role === 'agent' && (
                                <div className="text-right bg-slate-800/80 px-5 py-2 rounded-lg border border-emerald-500/30 shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                                    <div className="text-[10px] text-emerald-400 font-bold uppercase tracking-widest mb-1">התחשבנות סופית (מול המועדון)</div>
                                    <div className={`text-xl font-black money-value ${getColorClass(totalAgainstClub)}`}>{formatMoney(totalAgainstClub)}</div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ onLogin }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');

            return (
                <div className="min-h-screen flex items-center justify-center relative overflow-hidden bg-[#0b1120]">
                    <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px]"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px]"></div>
                    
                    <div className="glass-panel p-10 rounded-3xl w-full max-w-md z-10 shadow-2xl border border-slate-700/50 card-gradient">
                        <div className="text-center mb-10">
                            <div className="w-20 h-20 rounded-full bg-slate-900 flex items-center justify-center border border-emerald-500/30 mx-auto mb-5 shadow-[0_0_30px_rgba(16,185,129,0.15)]">
                                <span className="text-emerald-400 text-4xl font-black">♠</span>
                            </div>
                            <h2 className="text-3xl font-black text-white tracking-tight">מועדון NETABEL</h2>
                            <p className="text-slate-400 text-sm mt-2 font-medium">מערכת בנקאות והתחשבנות</p>
                        </div>
                        <form onSubmit={(e) => { e.preventDefault(); onLogin(user, pass); }} className="space-y-6">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">שם משתמש</label>
                                <input type="text" value={user} onChange={(e) => setUser(e.target.value)} required 
                                       className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all shadow-inner" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">סיסמה</label>
                                <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} required 
                                       className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all shadow-inner" />
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white font-bold text-lg py-4 px-4 rounded-xl shadow-[0_10px_20px_rgba(16,185,129,0.2)] transform transition hover:-translate-y-0.5 active:scale-95 mt-4">
                                כניסה למערכת
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        const AdminDashboard = ({ users, setUsers, records, setRecords, messages, setMessages, currentCycle, cyclesList, setCyclesList, showToast, uploadBatches, setUploadBatches }) => {
            const [activeTab, setActiveTab] = useState('import'); 

            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap bg-slate-900/80 rounded-xl p-1.5 border border-slate-700/50 shadow-sm">
                        {[
                            {id: 'import', name: 'ייבוא קבצים וניהול'},
                            {id: 'agents', name: 'סיכום סוכנים'},
                            {id: 'players', name: 'ניהול משתמשים ועמלות'},
                            {id: 'messages', name: 'מרכז הודעות'},
                            {id: 'settings', name: 'הגדרות מתקדמות'}
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                                    className={`flex-1 min-w-[140px] px-4 py-3 text-sm font-bold rounded-lg whitespace-nowrap transition-all duration-200 
                                    ${activeTab === tab.id ? 'bg-slate-700 text-white shadow-md' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                                {tab.name}
                            </button>
                        ))}
                    </div>

                    <div className="card-gradient rounded-2xl p-4 sm:p-8 border border-slate-700/50 shadow-2xl">
                        {activeTab === 'agents' && <AdminAgentsView users={users} records={records} currentCycle={currentCycle} showToast={showToast} />}
                        {activeTab === 'players' && <AdminPlayersView users={users} setUsers={setUsers} records={records} setRecords={setRecords} currentCycle={currentCycle} showToast={showToast} />}
                        {activeTab === 'import' && <AdminImportView setRecords={setRecords} setUsers={setUsers} users={users} currentCycle={currentCycle} setCyclesList={setCyclesList} cyclesList={cyclesList} records={records} showToast={showToast} uploadBatches={uploadBatches} setUploadBatches={setUploadBatches} />}
                        {activeTab === 'messages' && <AdminMessagesView users={users} messages={messages} setMessages={setMessages} showToast={showToast} />}
                        {activeTab === 'settings' && <AdminSettingsView users={users} setUsers={setUsers} records={records} setRecords={setRecords} currentCycle={currentCycle} cyclesList={cyclesList} setCyclesList={setCyclesList} showToast={showToast} setUploadBatches={setUploadBatches} uploadBatches={uploadBatches} />}
                    </div>
                </div>
            );
        };

        const AdminImportView = ({ setRecords, setUsers, users, currentCycle, cyclesList, setCyclesList, records, showToast, uploadBatches, setUploadBatches }) => {
            const [newCycleName, setNewCycleName] = useState('');
            const [isParsing, setIsParsing] = useState(false);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;

                const filename = file.name;
                
                // מניעת כפילויות בהעלאה
                if (uploadBatches.some(b => b.filename === filename && b.cycleId === currentCycle)) {
                    if (!window.confirm(`שימו לב: הקובץ "${filename}" כבר הועלה למחזור "${currentCycle}".\nהעלאה נוספת תכפיל את הנתונים!\nהאם להמשיך בכל זאת?`)) {
                        e.target.value = '';
                        return;
                    }
                }

                setIsParsing(true);

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        Papa.parse(text, {
                            complete: (results) => {
                                const rows = results.data;
                                if (!rows || rows.length === 0) {
                                    showToast('הקובץ ריק', 'error');
                                    setIsParsing(false);
                                    return;
                                }

                                let newPlayersCount = 0;
                                let newUsers = [...users];
                                let newRecordsList = [...records];
                                
                                const batchId = 'batch_' + Date.now();
                                const currentBatchDeltas = [];

                                const extractNum = (val) => {
                                    if (val === undefined || val === null || val === '') return 0;
                                    let str = String(val).trim();
                                    if (str.startsWith('(') && str.endsWith(')')) str = '-' + str.slice(1, -1);
                                    const cleaned = str.replace(/[^\d.-]/g, '');
                                    const num = parseFloat(cleaned);
                                    return isNaN(num) ? 0 : num;
                                };

                                let dataStartRow = -1;
                                let colMap = { nickname: -1, agent: -1, pnl: -1, fee: -1, hands: -1 };
                                
                                let currentTableName = "סיכום משחקים כללי";
                                let currentGameType = "-";
                                let currentDates = "-";

                                // Scan file to understand structure
                                for (let i = 0; i < Math.min(30, rows.length); i++) {
                                    const row = rows[i];
                                    if (!row || row.length === 0) continue;
                                    const rowStrLower = row.map(c => String(c).toLowerCase().trim());
                                    
                                    // Extract Detail Info if exists
                                    row.forEach(cell => {
                                        const c = String(cell).trim();
                                        const cl = c.toLowerCase();
                                        if (cl.includes('table name :') || cl.includes('tournament title :')) {
                                            currentTableName = c.split(',')[0].replace(/table name\s*:/i, '').replace(/tournament title\s*:/i, '').replace(/["']/g, '').trim();
                                        }
                                        if (cl.includes('game :')) {
                                            const match = c.match(/game\s*:\s*([^,]+)/i);
                                            if (match && match[1]) currentGameType = match[1].trim();
                                        }
                                        if (cl.includes('start/end time :') || cl.includes('period :')) {
                                            const match = c.match(/(?:start\/end time|period)\s*:\s*([^(]+)/i);
                                            if (match && match[1]) currentDates = match[1].replace('~', '-').trim();
                                        }
                                    });

                                    // Identify Header Row mapping
                                    const nickIdx = rowStrLower.indexOf('nickname') > -1 ? rowStrLower.indexOf('nickname') : rowStrLower.indexOf('player');
                                    
                                    if (nickIdx !== -1) {
                                        colMap.nickname = nickIdx;
                                        
                                        // The big file puts Agent at index 5 and Nickname at 9
                                        if (rowStrLower[5] === 'agent' || rowStrLower[5] === 'super agent') colMap.agent = 5;
                                        
                                        // Scan backwards from end of row to find 'total' columns reliably
                                        for(let c = rowStrLower.length - 1; c >= 0; c--) {
                                            const h = rowStrLower[c];
                                            if (h.includes('total') || h.includes('p&l')) {
                                                // Verify it's actually the PNL or Rake column by looking up
                                                let isPnl = false, isFee = false, isHands = false;
                                                for(let scanUp = i; scanUp >= Math.max(0, i-3); scanUp--) {
                                                    const headerUp = String(rows[scanUp][c] || '').toLowerCase();
                                                    if(headerUp.includes('p&l')) isPnl = true;
                                                    if(headerUp.includes('rake') || headerUp.includes('fee')) isFee = true;
                                                    if(headerUp.includes('hands')) isHands = true;
                                                }
                                                if (isPnl && colMap.pnl === -1) colMap.pnl = c;
                                                if (isFee && colMap.fee === -1) colMap.fee = c;
                                                if (isHands && colMap.hands === -1) colMap.hands = c;
                                            }
                                        }

                                        // Fallbacks
                                        if (colMap.pnl === -1) colMap.pnl = rowStrLower.findIndex(c => c.includes('p&l'));
                                        if (colMap.fee === -1) colMap.fee = rowStrLower.findIndex(c => c.includes('rake') || c.includes('fee') || c.includes('contribution'));
                                        if (colMap.hands === -1) colMap.hands = rowStrLower.findIndex(c => c.includes('hands'));

                                        dataStartRow = i + 1;
                                        // Skip secondary headers
                                        while(dataStartRow < rows.length && (!rows[dataStartRow] || !rows[dataStartRow][colMap.nickname] || String(rows[dataStartRow][0]).toLowerCase().includes('total') || String(rows[dataStartRow][colMap.nickname]).toLowerCase().includes('nickname') || String(rows[dataStartRow][colMap.nickname]).toLowerCase() === 'player')) {
                                            dataStartRow++;
                                        }
                                        break;
                                    }
                                }

                                if (dataStartRow === -1 || colMap.nickname === -1) {
                                     setIsParsing(false);
                                     showToast('לא נמצאו נתונים. ודא שקיימת עמודת Nickname והורדת מ-Google Sheets כ-CSV.', 'error');
                                     e.target.value = '';
                                     return;
                                }

                                for (let idx = dataStartRow; idx < rows.length; idx++) {
                                    const row = rows[idx];
                                    if (!row || row.length <= colMap.nickname) continue;
                                    
                                    const nicknameRaw = row[colMap.nickname];
                                    if(nicknameRaw === undefined || nicknameRaw === null) continue;
                                    
                                    const nickname = String(nicknameRaw).replace(/["']/g, '').trim();
                                    
                                    if (!nickname || nickname === '-' || nickname.toLowerCase().includes('total') || nickname.toLowerCase() === 'nickname' || nickname.toLowerCase() === 'player') continue;

                                    const pnl = colMap.pnl !== -1 ? extractNum(row[colMap.pnl]) : 0;
                                    const rake = colMap.fee !== -1 ? extractNum(row[colMap.fee]) : 0;
                                    const hands = colMap.hands !== -1 ? Math.round(extractNum(row[colMap.hands])) : 0;
                                    
                                    // זיהוי סוכן מהקובץ
                                    let assignedAgentId = 'agent_default';
                                    if (colMap.agent !== -1 && row[colMap.agent]) {
                                        const rawAgentName = String(row[colMap.agent]).toLowerCase().trim();
                                        const matchedAgent = newUsers.find(u => u.role === 'agent' && u.name.toLowerCase() === rawAgentName);
                                        if (matchedAgent) {
                                            assignedAgentId = matchedAgent.id;
                                        }
                                    }

                                    let player = newUsers.find(u => u.username === nickname);
                                    if (!player) {
                                        player = { 
                                            id: 'p_' + Date.now() + Math.random().toString(36).substr(2, 9), 
                                            username: nickname, 
                                            password: '123', 
                                            role: 'player', 
                                            name: nickname, 
                                            agentId: assignedAgentId, 
                                            customCommission: null 
                                        };
                                        newUsers.push(player);
                                        newPlayersCount++;
                                    } else if (player.agentId === 'agent_default' && assignedAgentId !== 'agent_default') {
                                        // השחקן היה "ללא סוכן", מעדכן לפי הקובץ. אם כבר יש לו סוכן, לא נוגעים!
                                        player.agentId = assignedAgentId;
                                    }

                                    const tableObj = { name: currentTableName, gameType: currentGameType, date: currentDates, hands: hands, pnl: pnl, rake: rake, batchId: batchId };

                                    const existingRecordIndex = newRecordsList.findIndex(r => r.cycleId === currentCycle && r.playerId === player.id);
                                    if (existingRecordIndex >= 0) {
                                        newRecordsList[existingRecordIndex].pnl += pnl;
                                        newRecordsList[existingRecordIndex].rake += rake;
                                        newRecordsList[existingRecordIndex].hands += hands;
                                        if(pnl !== 0 || rake !== 0 || hands !== 0) {
                                            newRecordsList[existingRecordIndex].tables.push(tableObj);
                                        }
                                    } else {
                                        const tablesArr = (pnl !== 0 || rake !== 0 || hands !== 0) ? [tableObj] : [];
                                        newRecordsList.push({
                                            id: Date.now() + Math.random(), 
                                            cycleId: currentCycle, 
                                            playerId: player.id, 
                                            pnl: pnl, 
                                            rake: rake, 
                                            hands: hands, 
                                            bonus: 0,
                                            tables: tablesArr
                                        });
                                    }

                                    if(pnl !== 0 || rake !== 0 || hands !== 0) {
                                        currentBatchDeltas.push({ playerId: player.id, pnl, rake, hands });
                                    }
                                }

                                if (currentBatchDeltas.length > 0 || newPlayersCount > 0) {
                                    const newBatch = {
                                        id: batchId,
                                        filename: filename,
                                        date: new Date().toLocaleString('he-IL'),
                                        cycleId: currentCycle,
                                        playersAffected: currentBatchDeltas.length,
                                        deltas: currentBatchDeltas
                                    };
                                    setUploadBatches([newBatch, ...uploadBatches]);
                                    setUsers(newUsers);
                                    setRecords(newRecordsList);
                                    showToast(`קובץ יובא בהצלחה! רשומות עלו: ${currentBatchDeltas.length}. שחקנים חדשים במאגר: ${newPlayersCount}.`);
                                } else {
                                    showToast('לא נמצאו נתונים פעילים להעלאה בקובץ זה.', 'error');
                                }

                                setIsParsing(false);
                                e.target.value = '';
                            },
                            error: (err) => {
                                console.error("PapaParse Error:", err);
                                setIsParsing(false);
                                showToast('שגיאה. ודא שזהו קובץ CSV תקין.', 'error');
                                e.target.value = '';
                            }
                        });
                    } catch (err) {
                        console.error("FileReader Error:", err);
                        setIsParsing(false);
                        showToast('שגיאה בקריאת הקובץ.', 'error');
                        e.target.value = '';
                    }
                };
                
                reader.readAsText(file);
            };

            const undoBatch = (batchId) => {
                if(!window.confirm('האם אתה בטוח שברצונך לבטל העלאה זו? פעולה זו תחסיר במדויק את הנתונים שהועלו מקובץ זה מתוך המחזור.')) return;
                
                const batch = uploadBatches.find(b => b.id === batchId);
                if(!batch) return;

                setRecords(prev => {
                    let updatedRecords = [...prev];
                    batch.deltas.forEach(delta => {
                        const recIdx = updatedRecords.findIndex(r => r.cycleId === batch.cycleId && r.playerId === delta.playerId);
                        if(recIdx > -1) {
                            updatedRecords[recIdx] = { ...updatedRecords[recIdx] };
                            updatedRecords[recIdx].pnl -= delta.pnl;
                            updatedRecords[recIdx].rake -= delta.rake;
                            updatedRecords[recIdx].hands -= delta.hands;
                            updatedRecords[recIdx].tables = updatedRecords[recIdx].tables.filter(t => t.batchId !== batchId);
                        }
                    });
                    return updatedRecords.filter(r => r.pnl !== 0 || r.rake !== 0 || r.hands !== 0 || r.tables.length > 0 || r.bonus !== 0);
                });
                
                setUploadBatches(prev => prev.filter(b => b.id !== batchId));
                showToast('ההעלאה בוטלה והנתונים קוזזו בהצלחה', 'success');
            };

            const addCycle = () => {
                if(newCycleName && !cyclesList.includes(newCycleName)) {
                    setCyclesList([newCycleName, ...cyclesList]);
                    setNewCycleName('');
                    showToast('מחזור חדש נוצר לרשימה!');
                }
            };

            return (
                <div className="space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="flex flex-col items-center justify-center p-10 text-center border-2 border-dashed border-slate-700 hover:border-emerald-500/50 rounded-2xl bg-slate-900/40 transition-colors shadow-inner relative overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-cyan-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <div className={`w-20 h-20 rounded-full flex items-center justify-center mb-6 shadow-2xl border-2 relative z-10 
                                ${isParsing ? 'bg-emerald-900/50 border-emerald-500 animate-pulse text-emerald-300' : 'bg-slate-800 border-slate-600 text-emerald-400'}`}>
                                <Icon name="upload" size={40} />
                            </div>
                            <h3 className="text-2xl font-black mb-3 text-white relative z-10">{isParsing ? 'מפענח נתונים מסקריפט...' : 'ייבוא נתונים מקובץ CSV'}</h3>
                            <p className="text-slate-400 text-sm mb-8 max-w-sm relative z-10 leading-relaxed">הורד את הדו"ח מ-Google Sheets או העלה Ring Game Detail לקבלת פירוט שולחנות.</p>
                            <label className={`cursor-pointer text-white px-8 py-4 rounded-xl font-bold shadow-lg transition-all relative z-10 border 
                                ${isParsing ? 'bg-slate-700 border-slate-600 opacity-50 cursor-not-allowed' : 'bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 border-transparent hover:-translate-y-1'}`}>
                                בחר קובץ CSV להעלאה
                                <input type="file" className="hidden" accept=".csv, text/csv" onChange={handleFileUpload} disabled={isParsing} />
                            </label>
                        </div>

                        <div className="bg-slate-900/60 p-8 rounded-2xl border border-slate-700/80 flex flex-col justify-center shadow-xl">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center border border-slate-600 text-cyan-400"><Icon name="dashboard" size={20}/></div>
                                <h3 className="text-xl font-bold text-white">ניהול מחזורים</h3>
                            </div>
                            <p className="text-slate-400 text-sm mb-6 leading-relaxed">הנתונים שתייבא כעת יתווספו אוטומטית למחזור: <strong className="text-emerald-400 bg-emerald-900/20 px-2 py-1 rounded border border-emerald-500/20">{currentCycle}</strong>.</p>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <input type="text" value={newCycleName} onChange={(e)=>setNewCycleName(e.target.value)} placeholder="שם מחזור חדש..." className="flex-1 bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500 shadow-inner" />
                                <button onClick={addCycle} className="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-bold transition-colors whitespace-nowrap shadow-md">צור מחזור</button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-900/80 rounded-2xl p-6 border border-slate-700/50 shadow-inner">
                        <h4 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><Icon name="history" size={20} className="text-cyan-400"/> היסטוריית העלאות (מנגנון ביטול / Rollback)</h4>
                        {uploadBatches.length === 0 ? (
                            <div className="text-center py-6 text-slate-500 bg-slate-800/20 rounded-xl border border-dashed border-slate-700">לא הועלו קבצים עדיין.</div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-right text-slate-300">
                                    <thead className="border-b border-slate-700 bg-slate-800/50">
                                        <tr><th className="p-3 text-right">תאריך העלאה</th><th className="p-3 text-right">שם הקובץ</th><th className="p-3 text-right">מחזור יעד</th><th className="p-3 text-center">רשומות שעלו</th><th className="p-3 text-left">פעולה</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {uploadBatches.map(batch => (
                                            <tr key={batch.id} className="hover:bg-slate-800 transition-colors">
                                                <td className="p-3 font-medium text-right">{batch.date}</td>
                                                <td className="p-3 text-right"><span className="font-mono text-xs text-slate-400 bg-slate-900/50 px-2 py-1 rounded inline-block mt-1 border border-slate-700">{batch.filename}</span></td>
                                                <td className="p-3 text-right"><span className="bg-slate-700 px-2 py-1 rounded text-xs text-white">{batch.cycleId}</span></td>
                                                <td className="p-3 text-center font-bold text-emerald-400">{batch.playersAffected}</td>
                                                <td className="p-3 text-left">
                                                    <button onClick={() => undoBatch(batch.id)} className="bg-red-900/40 text-red-400 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors border border-red-900/50">בטל העלאה זו</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AdminRecordEditor = ({ record, playerId, currentCycle, setRecords, showToast }) => {
            const [formData, setFormData] = useState({
                pnl: record?.pnl || 0,
                rake: record?.rake || 0,
                hands: record?.hands || 0
            });

            useEffect(() => {
                setFormData({
                    pnl: record?.pnl || 0,
                    rake: record?.rake || 0,
                    hands: record?.hands || 0
                });
            }, [record]);

            const saveChanges = () => {
                setRecords(prev => {
                    const existingIdx = prev.findIndex(r => r.cycleId === currentCycle && r.playerId === playerId);
                    if (existingIdx > -1) {
                        const newRecs = [...prev];
                        newRecs[existingIdx] = { ...newRecs[existingIdx], ...formData };
                        return newRecs;
                    } else {
                        return [...prev, { id: Date.now(), cycleId: currentCycle, playerId, bonus: 0, tables: [], ...formData }];
                    }
                });
                showToast('הנתונים התעדכנו ידנית במערכת!');
            };

            return (
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end mt-6 pt-5 border-t border-slate-700/50">
                    <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">תוצאה (P&L)</label>
                        <input type="number" value={formData.pnl} onChange={e => setFormData({...formData, pnl: parseFloat(e.target.value)||0})} className="w-full bg-slate-900/80 border border-slate-600 rounded-lg p-2.5 text-white outline-none focus:border-emerald-500 font-mono text-sm" />
                    </div>
                    <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">עמלה עקיפה (Rake)</label>
                        <input type="number" value={formData.rake} onChange={e => setFormData({...formData, rake: parseFloat(e.target.value)||0})} className="w-full bg-slate-900/80 border border-slate-600 rounded-lg p-2.5 text-white outline-none focus:border-emerald-500 font-mono text-sm" />
                    </div>
                    <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">מספר ידיים</label>
                        <input type="number" value={formData.hands} onChange={e => setFormData({...formData, hands: parseInt(e.target.value)||0})} className="w-full bg-slate-900/80 border border-slate-600 rounded-lg p-2.5 text-white outline-none focus:border-emerald-500 font-mono text-sm" />
                    </div>
                    <button onClick={saveChanges} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <Icon name="check" size={16}/> שמור עדכון ידני
                    </button>
                </div>
            );
        };

        const AdminPlayersView = ({ users, setUsers, records, setRecords, currentCycle, showToast }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const [expandedRow, setExpandedRow] = useState(null);
            const [bonusInput, setBonusInput] = useState({ playerId: null, amount: '' });
            
            const [isCreatingUser, setIsCreatingUser] = useState(false);
            const [newUser, setNewUser] = useState({ username: '', password: '123', role: 'player', name: '', commissionRate: 70 });

            const displayUsers = useMemo(() => {
                const filtered = users.filter(u => u.role !== 'admin'); 
                if (!searchQuery) return filtered;
                return filtered.filter(u => u.name.toLowerCase().includes(searchQuery.toLowerCase()) || u.username.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [users, searchQuery]);

            const agents = users.filter(u => u.role === 'agent');

            const updatePlayer = (id, field, value) => {
                setUsers(prevUsers => prevUsers.map(u => u.id === id ? { ...u, [field]: value } : u));
                if(field === 'agentId') showToast('השיוך עודכן בהצלחה!');
                if(field === 'customCommission') showToast('עמלה חריגה עודכנה בהצלחה!');
                if(field === 'role') showToast(value === 'agent' ? 'המשתמש הוגדר כסוכן!' : 'המשתמש הוגדר כשחקן');
            };

            const handleCreateUser = (e) => {
                e.preventDefault();
                if(users.find(u => u.username === newUser.username)) {
                    showToast('שם משתמש זה כבר קיים במערכת!', 'error');
                    return;
                }
                const newId = (newUser.role === 'agent' ? 'agent_' : 'p_') + Date.now();
                setUsers([...users, { ...newUser, id: newId, agentId: newUser.role === 'player' ? 'agent_default' : null, customCommission: null }]);
                showToast(`המשתמש ${newUser.username} נוצר בהצלחה כ-${newUser.role === 'agent' ? 'סוכן' : 'שחקן'}`);
                setIsCreatingUser(false);
                setNewUser({ username: '', password: '123', role: 'player', name: '', commissionRate: 70 });
            };

            const handleAddBonus = (playerId) => {
                if(!bonusInput.amount) return;
                const amt = parseFloat(bonusInput.amount);
                setRecords(prev => {
                    const existingIdx = prev.findIndex(r => r.cycleId === currentCycle && r.playerId === playerId);
                    if (existingIdx >= 0) {
                        const newRecords = [...prev];
                        newRecords[existingIdx] = { ...newRecords[existingIdx], bonus: (newRecords[existingIdx].bonus || 0) + amt };
                        return newRecords;
                    } else {
                        return [...prev, { id: Date.now(), cycleId: currentCycle, playerId, pnl: 0, rake: 0, hands: 0, bonus: amt, tables: [] }];
                    }
                });
                showToast(`בונוס ע"ס ${amt} נוסף בהצלחה לשחקן!`);
                setBonusInput({ playerId: null, amount: '' });
            };

            // Prevent event bubbling when clicking inside row controls
            const stopPropagation = (e) => e.stopPropagation();

            const toggleRow = (id) => {
                setExpandedRow(prev => prev === id ? null : id);
            };

            return (
                <div>
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-6">
                        <div><h3 className="text-xl font-bold text-white">ניהול משתמשים במערכת</h3><p className="text-sm text-slate-400 mt-1">שיוך לסוכנים, שינוי הרשאות ויצירת יוזרים ידנית.</p></div>
                        <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                            <button onClick={() => setIsCreatingUser(!isCreatingUser)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold transition-colors whitespace-nowrap flex items-center justify-center gap-2">
                                <Icon name="userPlus" size={16}/> צור משתמש / סוכן
                            </button>
                            <div className="relative flex-1 md:w-64">
                                <input type="text" placeholder="חפש משתמש..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-900/80 border border-slate-600 rounded-lg pl-4 pr-10 py-2 text-sm text-white outline-none focus:border-emerald-500 shadow-inner" />
                                <div className="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-500"><Icon name="search" size={16} /></div>
                            </div>
                        </div>
                    </div>

                    {isCreatingUser && (
                        <div className="bg-slate-800/80 border border-emerald-500/30 p-5 rounded-xl mb-6 shadow-lg modal-animate">
                            <h4 className="font-bold text-emerald-400 mb-4">יצירת משתמש חדש ידנית</h4>
                            <form onSubmit={handleCreateUser} className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 items-end">
                                <div><label className="block text-xs text-slate-400 mb-1">שם משתמש (התחברות)</label><input type="text" required value={newUser.username} onChange={e=>setNewUser({...newUser, username: e.target.value})} className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-emerald-500" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">כינוי תצוגה</label><input type="text" required value={newUser.name} onChange={e=>setNewUser({...newUser, name: e.target.value})} className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-emerald-500" /></div>
                                <div><label className="block text-xs text-slate-400 mb-1">סיסמה</label><input type="text" required value={newUser.password} onChange={e=>setNewUser({...newUser, password: e.target.value})} className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-emerald-500" /></div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">סוג המשתמש</label>
                                    <select value={newUser.role} onChange={e=>setNewUser({...newUser, role: e.target.value})} className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-emerald-500">
                                        <option value="player">שחקן (Player)</option>
                                        <option value="agent">סוכן (Agent)</option>
                                    </select>
                                </div>
                                <div className="flex gap-2">
                                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded font-bold transition w-full">שמור</button>
                                    <button type="button" onClick={()=>setIsCreatingUser(false)} className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded transition">בטל</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {displayUsers.length === 0 ? (
                        <div className="p-12 text-center border-2 border-dashed border-slate-700 rounded-2xl bg-slate-800/20">
                            <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center text-slate-500 mx-auto mb-4"><Icon name="users" size={32}/></div>
                            <h4 className="text-lg font-bold text-white mb-2">אין משתמשים במערכת</h4>
                            <p className="text-slate-400">יש לייבא קובץ CSV כדי לאכלס את המערכת בשחקנים.</p>
                        </div>
                    ) : (
                    <div className="overflow-x-auto rounded-xl border border-slate-700/50 shadow-xl">
                        <table className="w-full text-right text-sm">
                            <thead className="bg-slate-800 text-slate-300 uppercase text-[11px] tracking-widest">
                                <tr>
                                    <th className="p-4 font-bold border-b border-slate-700 w-12 text-center">פירוט</th>
                                    <th className="p-4 font-bold border-b border-slate-700 text-right">משתמש</th>
                                    <th className="p-4 font-bold border-b border-slate-700 text-center">תפקיד</th>
                                    <th className="p-4 font-bold border-b border-slate-700 text-right">סוכן משויך</th>
                                    <th className="p-4 font-bold border-b border-slate-700 text-center">עמלה (%)</th>
                                    <th className="p-4 font-bold border-b border-slate-700 text-right">פעולות ובונוס (לשחקנים)</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-700/50 bg-slate-900/30">
                                {displayUsers.map(u => {
                                    const record = records.find(r => r.cycleId === currentCycle && r.playerId === u.id) || { pnl: 0, hands: 0, bonus: 0, tables: [] };
                                    const finalPnl = record.pnl + (record.bonus || 0);
                                    
                                    const isWhale = Math.abs(finalPnl) >= 5000 && u.role === 'player';
                                    const isHot = record.hands >= 3000 && u.role === 'player';

                                    return (
                                        <Fragment key={u.id}>
                                            <tr className={`transition-colors ${expandedRow === u.id ? 'bg-slate-800' : 'hover:bg-slate-800/50'}`} onClick={() => toggleRow(u.id)}>
                                                <td className="p-4 text-center cursor-pointer text-slate-400 hover:text-emerald-400">
                                                    <div className={`p-1.5 rounded-md inline-flex ${expandedRow === u.id ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800'}`}>
                                                        {expandedRow === u.id ? <Icon name="chevronUp" size={16}/> : <Icon name="chevronDown" size={16}/>}
                                                    </div>
                                                </td>
                                                <td className="p-4 cursor-pointer text-right">
                                                    <div className="font-bold text-white text-base flex items-center justify-start gap-2">
                                                        {isHot && <span title="פעיל מאוד! שוחקו המון ידיים">🔥</span>}
                                                        {isWhale && <span title="לוויתן! מעל 5000 שח רווח/הפסד">🐋</span>}
                                                        {u.name}
                                                    </div>
                                                    <div className="text-xs text-slate-500">יוזר: {u.username}</div>
                                                </td>
                                                <td className="p-4 text-center" onClick={stopPropagation}>
                                                    <select value={u.role} onChange={(e) => {
                                                        const newRole = e.target.value;
                                                        setUsers(prev => prev.map(userItem => {
                                                            if(userItem.id === u.id) {
                                                                if(newRole === 'agent') return { ...userItem, role: 'agent', commissionRate: 70, agentId: null };
                                                                if(newRole === 'player') return { ...userItem, role: 'player', agentId: 'agent_default' };
                                                            }
                                                            return userItem;
                                                        }));
                                                        showToast(`התפקיד שונה ל-${newRole === 'agent' ? 'סוכן' : 'שחקן'}`);
                                                    }} className={`bg-transparent font-bold outline-none cursor-pointer text-center ${u.role === 'agent' ? 'text-cyan-400' : 'text-slate-300'}`}>
                                                        <option value="player" className="bg-slate-900 text-white">שחקן</option>
                                                        <option value="agent" className="bg-slate-900 text-white">סוכן</option>
                                                    </select>
                                                </td>
                                                <td className="p-4 text-right" onClick={stopPropagation}>
                                                    {u.role === 'player' ? (
                                                        <select value={u.agentId || 'agent_default'} onChange={(e) => updatePlayer(u.id, 'agentId', e.target.value)} className={`bg-slate-900 border rounded-lg px-2 py-1.5 text-sm text-white font-medium outline-none cursor-pointer transition-colors ${u.agentId === 'agent_default' ? 'border-red-500/50 text-red-400 bg-red-900/10' : 'border-slate-600 focus:border-emerald-500'}`}>
                                                            {agents.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                                        </select>
                                                    ) : <span className="text-slate-600 text-xs">לא רלוונטי לסוכן</span>}
                                                </td>
                                                <td className="p-4 text-center" onClick={stopPropagation}>
                                                    <div className="inline-flex items-center justify-center bg-slate-900 border border-slate-600 rounded-lg overflow-hidden focus-within:border-emerald-500 transition-colors">
                                                        <input type="number" placeholder={u.role === 'agent' ? "בסיס" : "דיפולט"} value={(u.role === 'agent' ? u.commissionRate : u.customCommission) !== null ? (u.role === 'agent' ? u.commissionRate : u.customCommission) : ''} onChange={(e) => {
                                                            const val = e.target.value === '' ? null : Number(e.target.value);
                                                            if (u.role === 'agent') updatePlayer(u.id, 'commissionRate', val || 0);
                                                            else updatePlayer(u.id, 'customCommission', val);
                                                        }} className={`bg-transparent px-2 py-1.5 text-sm text-center w-16 outline-none ${u.customCommission !== null || u.role === 'agent' ? 'text-emerald-400 font-bold' : 'text-white'}`} />
                                                        <span className="bg-slate-800 text-slate-400 px-2 py-1.5 font-bold text-xs">%</span>
                                                    </div>
                                                </td>
                                                <td className="p-4 text-right" onClick={stopPropagation}>
                                                    {u.role === 'player' ? (
                                                        bonusInput.playerId === u.id ? (
                                                            <div className="flex items-center justify-end gap-2 bg-slate-900 p-1.5 rounded-lg border border-slate-600">
                                                                <input type="number" value={bonusInput.amount} onChange={(e)=>setBonusInput({...bonusInput, amount: e.target.value})} placeholder="סכום" className="bg-transparent text-xs w-16 text-white outline-none px-1 text-center" autoFocus />
                                                                <button onClick={() => handleAddBonus(u.id)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded text-xs font-bold transition-colors">שמור</button>
                                                                <button onClick={() => setBonusInput({playerId: null, amount:''})} className="text-slate-400 hover:text-white px-1 text-xs transition-colors">בטל</button>
                                                            </div>
                                                        ) : (
                                                            <button onClick={() => setBonusInput({playerId: u.id, amount: ''})} className={`text-xs flex items-center justify-center gap-2 w-full transition-colors font-medium px-3 py-2 rounded-lg ${record.bonus > 0 ? 'bg-emerald-900/20 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-900/40' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                                                <Icon name="gift" size={14}/> {record.bonus > 0 ? `עודכן: ${formatMoney(record.bonus)}` : 'הוסף בונוס'}
                                                            </button>
                                                        )
                                                    ) : null}
                                                </td>
                                            </tr>
                                            {expandedRow === u.id && (
                                                <tr className="bg-slate-900">
                                                    <td colSpan="6" className="p-0 border-b border-slate-800">
                                                        <PlayerDetailsDrilldown player={u} record={record} finalPnl={finalPnl} showToast={showToast} />
                                                        {u.role === 'player' && (
                                                            <div className="px-6 sm:px-10 pb-8 bg-slate-900/80">
                                                                <div className="bg-slate-800/50 p-5 rounded-xl border border-slate-700 shadow-md">
                                                                    <h4 className="text-emerald-400 font-bold flex items-center gap-2 text-sm uppercase tracking-widest">
                                                                        <Icon name="edit" size={16}/> עריכת נתוני מחזור ידנית
                                                                    </h4>
                                                                    <AdminRecordEditor record={record} playerId={u.id} currentCycle={currentCycle} setRecords={setRecords} showToast={showToast} />
                                                                </div>
                                                            </div>
                                                        )}
                                                    </td>
                                                </tr>
                                            )}
                                        </Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    )}
                </div>
            );
        };

        const AdminMessagesView = ({ users, messages, setMessages, showToast }) => {
            const [text, setText] = useState(''); const [imgUrl, setImgUrl] = useState(''); const [targetId, setTargetId] = useState('all');
            const sendMsg = () => {
                if(!text) return;
                setMessages([{ id: Date.now(), senderId: 'admin1', receiverId: targetId, text, image: imgUrl, date: new Date().toLocaleDateString('he-IL') }, ...messages]);
                setText(''); setImgUrl(''); showToast('ההודעה נשלחה לנמענים!');
            };
            return (
