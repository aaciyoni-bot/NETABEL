                            </thead>
                            <tbody className="divide-y divide-slate-800">
                                {players.map(player => {
                                    const record = records.find(r => r.cycleId === currentCycle && r.playerId === player.id) || { pnl: 0, bonus: 0, tables: [] };
                                    const finalPnl = record.pnl + (record.bonus || 0);

                                    return (
                                        <Fragment key={player.id}>
                                            <tr className="hover:bg-slate-800/30 transition-colors">
                                                <td className="p-4 text-center cursor-pointer text-slate-500 hover:text-emerald-400" onClick={() => toggleRow(player.id)}>
                                                    {expandedRow === player.id ? <Icon name="chevronUp" size={18}/> : <Icon name="chevronDown" size={18}/>}
                                                </td>
                                                <td className="p-4 text-right cursor-pointer" onClick={() => toggleRow(player.id)}>
                                                    <div className="font-bold text-slate-200">{player.name}</div>
                                                </td>
                                                <td className="p-4 text-right">
                                                    <select 
                                                        value={player.agentId} 
                                                        onChange={(e) => updatePlayer(player.id, 'agentId', e.target.value)}
                                                        className={`bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-white ${player.agentId === 'agent_default' ? 'border-red-500/50 text-red-300' : ''}`}
                                                    >
                                                        {agents.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                                    </select>
                                                </td>
                                                <td className="p-4 text-right">
                                                    <div className="flex items-center justify-end gap-2">
                                                        <input 
                                                            type="number" 
                                                            placeholder="דיפולט"
                                                            value={player.customCommission !== null ? player.customCommission : ''}
                                                            onChange={(e) => updatePlayer(player.id, 'customCommission', e.target.value === '' ? null : Number(e.target.value))}
                                                            className={`bg-slate-900 border rounded px-2 py-1 text-sm text-white w-20 text-center focus:border-emerald-500 outline-none ${player.customCommission !== null ? 'border-emerald-500/50 text-emerald-300' : 'border-slate-700'}`}
                                                        />
                                                        <span className="text-slate-500">%</span>
                                                    </div>
                                                </td>
                                                <td className="p-4 text-right">
                                                    {bonusInput.playerId === player.id ? (
                                                        <div className="flex items-center justify-end gap-2">
                                                            <input 
                                                                type="number" 
                                                                value={bonusInput.amount} 
                                                                onChange={(e)=>setBonusInput({...bonusInput, amount: e.target.value})}
                                                                placeholder="סכום"
                                                                className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm w-20 text-white"
                                                            />
                                                            <button onClick={() => handleAddBonus(player.id)} className="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white px-2 py-1 rounded text-xs transition-colors">שמור</button>
                                                            <button onClick={() => setBonusInput({playerId: null, amount:''})} className="text-slate-500 hover:text-slate-300 text-xs px-2 py-1">בטל</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => setBonusInput({playerId: player.id, amount: ''})} className="text-emerald-500 hover:text-emerald-400 text-sm flex items-center gap-1 justify-end w-full transition-colors">
                                                            <Icon name="gift" size={16}/> {record.bonus > 0 ? `(עודכן ${formatMoney(record.bonus)})` : 'הוסף בונוס'}
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                            {/* Drill-down Admin View */}
                                            {expandedRow === player.id && (
                                                <tr className="bg-slate-900/50">
                                                    <td colSpan="5" className="p-0 border-b border-slate-800">
                                                        <div className="px-6 sm:px-12 py-6 grid grid-cols-1 md:grid-cols-3 gap-6 border-t border-slate-800/50">
                                                            {/* User Details */}
                                                            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50">
                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                                                    <Icon name="eye" size={14}/> פרטי התחברות
                                                                </h4>
                                                                <div className="space-y-2 text-sm">
                                                                    <div className="flex justify-between"><span className="text-slate-500">שם משתמש:</span> <span className="font-mono text-emerald-400">{player.username}</span></div>
                                                                    <div className="flex justify-between"><span className="text-slate-500">סיסמה:</span> <span className="font-mono text-emerald-400">{player.password}</span></div>
                                                                </div>
                                                            </div>
                                                            {/* Total Result */}
                                                            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50">
                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">תוצאה סופית (נטו לשחקן)</h4>
                                                                <div className={`text-3xl font-black ${getColorClass(finalPnl)}`}>{formatMoney(finalPnl)}</div>
                                                                {record.bonus > 0 && <div className="text-xs text-emerald-400 mt-1">כולל בונוס {formatMoney(record.bonus)}</div>}
                                                            </div>
                                                            {/* Tables List */}
                                                            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 md:col-span-3">
                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">פירוט שולחנות ומשחקים</h4>
                                                                {record.tables && record.tables.length > 0 ? (
                                                                    <div className="overflow-x-auto">
                                                                        <table className="w-full text-xs text-right text-slate-300">
                                                                            <thead className="border-b border-slate-700">
                                                                                <tr>
                                                                                    <th className="pb-2 text-slate-500 font-medium">שם שולחן / טורניר</th>
                                                                                    <th className="pb-2 text-slate-500 font-medium">ידיים</th>
                                                                                    <th className="pb-2 text-slate-500 font-medium">תוצאה (P&L)</th>
                                                                                </tr>
                                                                            </thead>
                                                                            <tbody>
                                                                                {record.tables.map((t, idx) => (
                                                                                    <tr key={idx} className="border-b border-slate-800/50 last:border-0 hover:bg-slate-800 transition-colors">
                                                                                        <td className="py-2">{t.name}</td>
                                                                                        <td className="py-2">{t.hands}</td>
                                                                                        <td className={`py-2 font-medium ${getColorClass(t.pnl)}`}>{formatMoney(t.pnl)}</td>
                                                                                    </tr>
                                                                                ))}
                                                                            </tbody>
                                                                        </table>
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-slate-500 text-sm">אין פירוט ברמת שולחן (הנתונים יובאו מדוח כללי).</span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    )}
                </div>
            );
        };

        // --- Admin: Import View ---
        const AdminImportView = ({ setRecords, setUsers, users, currentCycle, cyclesList, setCyclesList, records, showToast }) => {
            const [newCycleName, setNewCycleName] = useState('');
            const [isParsing, setIsParsing] = useState(false);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;

                setIsParsing(true);

                Papa.parse(file, {
                    complete: (results) => {
                        const rows = results.data;
                        let newPlayersCount = 0;
                        let newRecordsCount = 0;
                        let tablesAdded = 0;
                        
                        let nicknameIndex = -1, pnlIndex = -1, rakeIndex = -1, handsIndex = -1, tableIndex = -1;
                        let dataStartRow = 1;

                        // Scan to find headers dynamically
                        for (let i = 0; i < Math.min(20, rows.length); i++) {
                            if (!rows[i]) continue;
                            rows[i].forEach((cell, colIdx) => {
                                if (!cell) return;
                                const t = cell.toString().toLowerCase().trim();
                                if (t === 'nickname' || t === 'player') nicknameIndex = colIdx;
                                if (t === 'p&l' || t === 'player p&l') pnlIndex = colIdx;
                                if (t === 'rake' || t === 'contribution fee' || t.includes('rake&fee')) rakeIndex = colIdx;
                                if (t === 'hands' || t === 'played hands') handsIndex = colIdx;
                                if (t === 'table name' || t === 'tournament title') tableIndex = colIdx;
                            });
                            if (nicknameIndex !== -1 && dataStartRow === 1) {
                                dataStartRow = i + 1;
                                break;
                            }
                        }

                        // Fallbacks
                        if (nicknameIndex === -1) nicknameIndex = 3;
                        if (pnlIndex === -1) pnlIndex = 13;
                        if (rakeIndex === -1) rakeIndex = 12;
                        if (handsIndex === -1) handsIndex = 6;
                        
                        let newUsers = [...users];
                        let newRecordsList = [...records];

                        const cleanNum = (str) => {
                            if (!str) return 0;
                            const cleaned = str.toString().replace(/["',]/g, '').trim();
                            const num = parseFloat(cleaned);
                            return isNaN(num) ? 0 : num;
                        };

                        // Are we looking at a detailed file (with table names) or general?
                        const hasTables = tableIndex !== -1;

                        for (let idx = dataStartRow; idx < rows.length; idx++) {
                            const row = rows[idx];
                            if(!row || row.length < nicknameIndex) continue; 
                            
                            const nicknameRaw = row[nicknameIndex];
                            if(!nicknameRaw) continue;
                            
                            const nickname = nicknameRaw.toString().replace(/["']/g, '').trim();
                            if(!nickname || nickname === '-' || nickname.toLowerCase() === 'nickname' || nickname.toLowerCase() === 'player') continue;

                            // Create User if not exists
                            let player = newUsers.find(u => u.username === nickname);
                            if(!player) {
                                player = {
                                    id: 'p_' + Date.now() + Math.random(),
                                    username: nickname,
                                    password: '123',
                                    role: 'player',
                                    name: nickname,
                                    agentId: 'agent_default',
                                    customCommission: null
                                };
                                newUsers.push(player);
                                newPlayersCount++;
                            }

                            // Extract values
                            const pnl = cleanNum(row[pnlIndex]);
                            const rake = cleanNum(row[rakeIndex]);
                            const hands = handsIndex > -1 ? Math.round(cleanNum(row[handsIndex])) : 0;
                            const tableName = hasTables ? (row[tableIndex] || "משחק כללי") : "סיכום כללי";

                            if (pnl === 0 && rake === 0 && hands === 0) continue;

                            const existingRecordIndex = newRecordsList.findIndex(r => r.cycleId === currentCycle && r.playerId === player.id);
                            
                            if (existingRecordIndex >= 0) {
                                // Add to existing record
                                newRecordsList[existingRecordIndex].pnl += pnl;
                                newRecordsList[existingRecordIndex].rake += rake;
                                newRecordsList[existingRecordIndex].hands += hands;
                                
                                // Append table details if applicable
                                if(hasTables || pnl !== 0) {
                                    newRecordsList[existingRecordIndex].tables.push({ name: tableName, hands: hands, pnl: pnl, rake: rake });
                                    tablesAdded++;
                                }
                            } else {
                                // Create new record
                                const initialTables = (hasTables || pnl !== 0) ? [{ name: tableName, hands: hands, pnl: pnl, rake: rake }] : [];
                                newRecordsList.push({
                                    id: Date.now() + Math.random(),
                                    cycleId: currentCycle,
                                    playerId: player.id,
                                    pnl: pnl,
                                    rake: rake,
                                    hands: hands,
                                    bonus: 0,
                                    tables: initialTables
                                });
                                newRecordsCount++;
                            }
                        }

                        setUsers(newUsers);
                        setRecords(newRecordsList);
                        setIsParsing(false);
                        
                        showToast(`הקובץ פוענח בהצלחה! ${newPlayersCount} שחקנים חדשים נוספו.`);
                        e.target.value = ''; // Reset input
                    },
                    error: (err) => {
                        setIsParsing(false);
                        showToast('שגיאה בקריאת הקובץ', 'error');
                    },
                    skipEmptyLines: true
                });
            };

            const addCycle = () => {
                if(newCycleName && !cyclesList.includes(newCycleName)) {
                    setCyclesList([newCycleName, ...cyclesList]);
                    setNewCycleName('');
                    showToast('מחזור חדש נוצר במערכת!');
                }
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="flex flex-col items-center justify-center p-8 text-center border-2 border-dashed border-slate-700 hover:border-emerald-500/50 rounded-xl bg-slate-900/30 transition-colors">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center mb-4 shadow-lg border ${isParsing ? 'bg-emerald-900/50 border-emerald-500 animate-pulse text-emerald-300' : 'bg-slate-800 border-slate-700 text-emerald-400'}`}>
                            <Icon name="upload" size={32} />
                        </div>
                        <h3 className="text-xl font-bold mb-2 text-white">{isParsing ? 'מפענח נתונים...' : 'ייבוא נתונים (CSV/Excel)'}</h3>
                        <p className="text-slate-400 text-sm mb-6 max-w-sm">
                            העלה את דוחות ה-Ring Game Detail / Member Statistics. המערכת חכמה ויודעת למשוך נתונים ולשייך לשחקנים רלוונטיים.
                        </p>
                        <label className={`cursor-pointer text-white px-6 py-3 rounded-lg font-medium shadow-lg transition-all border ${isParsing ? 'bg-slate-600 border-slate-500 opacity-50 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700 border-slate-600'}`}>
                            בחר קובץ לחלץ נתונים
                            <input type="file" className="hidden" accept=".csv, text/csv, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, .xlsx" onChange={handleFileUpload} disabled={isParsing} />
                        </label>
                    </div>

                    <div className="bg-slate-900/50 p-6 rounded-xl border border-slate-800 flex flex-col justify-center">
                        <h3 className="text-lg font-bold text-white mb-4">ניהול מחזורים</h3>
                        <p className="text-slate-400 text-sm mb-4">
                            המחזור הפעיל: <strong className="text-emerald-400">{currentCycle}</strong>.<br/>
                            כדי להתחיל שבוע חדש, צור מחזור ולאחר מכן ייבא דוחות.
                        </p>
                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                value={newCycleName}
                                onChange={(e)=>setNewCycleName(e.target.value)}
                                placeholder="לדוג': 26/05 - 02/06" 
                                className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none focus:border-emerald-500"
                            />
                            <button onClick={addCycle} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium transition-colors whitespace-nowrap">
                                הוסף מחזור
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Admin: Messages View ---
        const AdminMessagesView = ({ users, messages, setMessages, showToast }) => {
            const [text, setText] = useState('');
            const [imgUrl, setImgUrl] = useState('');
            const [targetId, setTargetId] = useState('all');

            const sendMsg = () => {
                if(!text) return;
                const newMsg = { id: Date.now(), senderId: 'admin1', receiverId: targetId, text, image: imgUrl, date: new Date().toLocaleDateString('he-IL') };
                setMessages([newMsg, ...messages]);
                setText(''); setImgUrl('');
                showToast('ההודעה נשלחה לנמענים!');
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="space-y-4">
                        <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2"><Icon name="message" size={20}/> שלח הודעה חדשה</h3>
                        <div>
                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">נמען</label>
                            <select value={targetId} onChange={(e)=>setTargetId(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white outline-none focus:border-emerald-500">
                                <option value="all">כולם (גלובלי לשחקנים וסוכנים)</option>
                                <optgroup label="סוכנים">{users.filter(u=>u.role==='agent').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</optgroup>
                                <optgroup label="שחקנים">{users.filter(u=>u.role==='player').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</optgroup>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">תוכן ההודעה (קופץ באינבוקס)</label>
                            <textarea value={text} onChange={(e)=>setText(e.target.value)} rows="4" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white outline-none focus:border-emerald-500" placeholder="הקלד כאן..."></textarea>
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">כתובת תמונה (אופציונלי)</label>
                            <input type="text" value={imgUrl} onChange={(e)=>setImgUrl(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white outline-none focus:border-emerald-500" placeholder="https://..." />
                        </div>
                        <button onClick={sendMsg} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-lg shadow-lg transition-transform active:scale-95 w-full">
                            שגר הודעה במערכת
                        </button>
                    </div>
                    <div className="bg-slate-900 rounded-xl p-5 border border-slate-800 h-[500px] overflow-y-auto">
                        <h4 className="text-sm font-semibold text-slate-400 mb-4 sticky top-0 bg-slate-900 pb-2 border-b border-slate-800">היסטוריית הודעות שנשלחו</h4>
                        <div className="space-y-4">
                            {messages.filter(m => m.senderId === 'admin1').map(m => (
                                <div key={m.id} className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 text-sm relative">
                                    <div className="flex justify-between items-start mb-2">
                                        <span className="font-bold text-emerald-400 text-xs">נמען: {m.receiverId === 'all' ? 'כולם' : users.find(u=>u.id===m.receiverId)?.name || 'לא ידוע'}</span>
                                        <span className="text-[10px] text-slate-500">{m.date}</span>
                                    </div>
                                    <p className="text-slate-200 leading-relaxed">{m.text}</p>
                                    {m.image && <img src={m.image} alt="Attachment" className="mt-3 rounded border border-slate-700 max-h-32 object-cover" />}
                                </div>
                            ))}
                            {messages.length === 0 && <p className="text-slate-500 text-center py-10">לא נשלחו הודעות עדיין.</p>}
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // AGENT DASHBOARD
        // ==========================================
        const AgentDashboard = ({ user, users, records, currentCycle, showToast }) => {
            const [sortBy, setSortBy] = useState('pnl');
            const [expandedRow, setExpandedRow] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            const myPlayers = users.filter(u => u.agentId === user.id);
            
            const playerStats = useMemo(() => {
                const filtered = searchQuery 
                    ? myPlayers.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.username.toLowerCase().includes(searchQuery.toLowerCase()))
                    : myPlayers;

                return filtered.map(player => {
                    const record = records.find(r => r.cycleId === currentCycle && r.playerId === player.id) || { pnl: 0, rake: 0, hands: 0, bonus: 0, tables: [] };
                    const rate = player.customCommission !== null ? player.customCommission : user.commissionRate;
                    const commission = (record.rake * (1 - SYSTEM_EXPENSES_RATE)) * (rate / 100);
                    return { ...player, ...record, calculatedCommission: commission, finalPnl: record.pnl + (record.bonus || 0) };
                }).sort((a, b) => {
                    if (sortBy === 'pnl') return a.pnl - b.pnl;
                    if (sortBy === 'commission') return b.calculatedCommission - a.calculatedCommission;
                    if (sortBy === 'hands') return b.hands - a.hands;
                    return 0;
                });
            }, [myPlayers, records, currentCycle, user.commissionRate, sortBy, searchQuery]);

            const toggleRow = (id) => setExpandedRow(expandedRow === id ? null : id);

            return (
                <div className="space-y-6">
                    <div className="card-gradient rounded-xl p-4 sm:p-6 border border-slate-800 shadow-xl">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <h3 className="text-lg font-bold text-white">רשימת השחקנים שלי</h3>
                            
                            <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                                <div className="relative w-full sm:w-56">
                                    <input 
                                        type="text" 
                                        placeholder="חיפוש שחקן..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg pl-4 pr-10 py-1.5 text-sm text-white outline-none focus:border-emerald-500"
                                    />
                                    <div className="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-500">
                                        <Icon name="search" size={16} />
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 w-full sm:w-auto">
                                    <Icon name="sort" size={16} className="text-slate-400"/>
                                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-transparent text-sm text-slate-300 outline-none cursor-pointer w-full">
                                        <option value="pnl">מיון: P&L</option>
                                        <option value="commission">מיון: עמלה</option>
                                        <option value="hands">מיון: ידיים</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div className="overflow-x-auto rounded-lg border border-slate-800">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-900/80 text-slate-400 uppercase text-[11px] tracking-wider">
                                    <tr>
                                        <th className="p-4 font-semibold text-right w-10"></th>
                                        <th className="p-4 font-semibold text-right">כינוי השחקן</th>
                                        <th className="p-4 font-semibold text-right">מספר ידיים</th>
                                        <th className="p-4 font-semibold text-right">תוצאה (P&L)</th>
                                        <th className="p-4 font-semibold text-right text-emerald-400">עמלה לתשלום</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {playerStats.map(stat => (
                                        <Fragment key={stat.id}>
                                            <tr className="hover:bg-slate-800/30 transition-colors cursor-pointer group" onClick={() => toggleRow(stat.id)}>
                                                <td className="p-4 text-center text-slate-500 group-hover:text-emerald-400">
                                                    {expandedRow === stat.id ? <Icon name="chevronUp" size={18}/> : <Icon name="chevronDown" size={18}/>}
                                                </td>
                                                <td className="p-4 text-right">
                                                    <div className="font-bold text-slate-200">{stat.name}</div>
                                                    <div className="text-[10px] text-slate-500">{stat.username}</div>
                                                </td>
                                                <td className="p-4 text-right font-medium">{stat.hands.toLocaleString()}</td>
                                                <td className={`p-4 text-right font-bold ${getColorClass(stat.pnl)}`}>{formatMoney(stat.pnl)}</td>
                                                <td className="p-4 text-right font-black text-emerald-400">{formatMoney(stat.calculatedCommission)}</td>
                                            </tr>
                                            {/* Drill-down View for Agent */}
                                            {expandedRow === stat.id && (
                                                <tr className="bg-slate-900/50">
                                                    <td colSpan="5" className="p-0 border-b border-slate-800">
                                                        <div className="px-6 sm:px-12 py-6 grid grid-cols-1 md:grid-cols-3 gap-6 border-t border-slate-800/50">
                                                            
                                                            {/* User Details */}
                                                            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50">
                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                                                    <Icon name="eye" size={14}/> פרטי התחברות
                                                                </h4>
                                                                <div className="space-y-2 text-sm">
                                                                    <div className="flex justify-between"><span className="text-slate-500">שם משתמש:</span> <span className="font-mono text-emerald-400">{stat.username}</span></div>
                                                                    <div className="flex justify-between"><span className="text-slate-500">סיסמה:</span> <span className="font-mono text-emerald-400">{stat.password}</span></div>
                                                                </div>
                                                                <div className="mt-4 pt-3 border-t border-slate-700">
                                                                    <button onClick={() => { navigator.clipboard.writeText(`משתמש: ${stat.username}\nסיסמה: ${stat.password}`); showToast('פרטים הועתקו ללוח'); }} className="text-xs text-slate-400 hover:text-white transition w-full text-right">
                                                                        העתק פרטים לשליחה
                                                                    </button>
                                                                </div>
                                                            </div>

                                                            {/* Total Result */}
                                                            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50">
                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">תוצאה סופית (נטו לשחקן)</h4>
                                                                <div className={`text-3xl font-black ${getColorClass(stat.finalPnl)}`}>{formatMoney(stat.finalPnl)}</div>
                                                                {stat.bonus > 0 && <div className="text-xs text-emerald-400 mt-1">כולל בונוס מהמועדון: {formatMoney(stat.bonus)}</div>}
                                                            </div>

                                                            {/* Tables List */}
                                                            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 md:col-span-3">
                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">פירוט שולחנות ומשחקים</h4>
                                                                {stat.tables && stat.tables.length > 0 ? (
                                                                    <div className="overflow-x-auto">
                                                                        <table className="w-full text-xs text-right text-slate-300">
                                                                            <thead className="border-b border-slate-700">
                                                                                <tr>
                                                                                    <th className="pb-2 text-slate-500 font-medium">שם שולחן / טורניר</th>
                                                                                    <th className="pb-2 text-slate-500 font-medium">ידיים</th>
                                                                                    <th className="pb-2 text-slate-500 font-medium">תוצאה (P&L)</th>
                                                                                </tr>
                                                                            </thead>
                                                                            <tbody>
                                                                                {stat.tables.map((t, idx) => (
                                                                                    <tr key={idx} className="border-b border-slate-800/50 last:border-0 hover:bg-slate-800 transition-colors">
                                                                                        <td className="py-2">{t.name}</td>
                                                                                        <td className="py-2">{t.hands}</td>
                                                                                        <td className={`py-2 font-medium ${getColorClass(t.pnl)}`}>{formatMoney(t.pnl)}</td>
                                                                                    </tr>
                                                                                ))}
                                                                            </tbody>
                                                                        </table>
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-slate-500 text-sm">אין פירוט ברמת שולחן (הנתונים יובאו מדוח כללי).</span>
                                                                )}
                                                            </div>

                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </Fragment>
                                    ))}
                                    {playerStats.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-500">אין שחקנים להציג בחיפוש זה</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // PLAYER DASHBOARD (BANK VIP STYLE)
        // ==========================================
        const PlayerDashboard = ({ user, records, messages, currentCycle }) => {
            const cycleRecord = records.find(r => r.cycleId === currentCycle && r.playerId === user.id) || { pnl: 0, hands: 0, bonus: 0, tables: [] };
            const finalResult = (cycleRecord.pnl || 0) + (cycleRecord.bonus || 0);
            const myMessages = messages.filter(m => m.receiverId === 'all' || m.receiverId === user.id);

            const getRank = (hands) => {
                if(hands > 10000) return { name: 'Titanium', color: 'text-purple-400', bg: 'bg-purple-900/20', border: 'border-purple-500/30' };
                if(hands > 5000) return { name: 'Gold', color: 'text-yellow-400', bg: 'bg-yellow-900/20', border: 'border-yellow-500/30' };
                if(hands > 1000) return { name: 'Silver', color: 'text-slate-300', bg: 'bg-slate-700/50', border: 'border-slate-500/50' };
                return { name: 'Bronze', color: 'text-orange-400', bg: 'bg-orange-900/20', border: 'border-orange-500/30' };
            };
            const rank = getRank(cycleRecord.hands || 0);

            return (
                <div className="max-w-3xl mx-auto space-y-8 mt-4">
                    {/* The "Credit Card" */}
                    <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-800 to-[#0b1120] border border-slate-700 shadow-2xl p-8 sm:p-12">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-[80px] pointer-events-none"></div>
                        
                        <div className="relative z-10 flex flex-col gap-8">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h2 className="text-slate-400 text-xs font-bold tracking-[0.2em] uppercase mb-2">יתרת מחזור עדכנית</h2>
                                    <div className={`text-6xl font-black tracking-tight ${getColorClass(finalResult)} drop-shadow-lg`}>
                                        {formatMoney(finalResult)}
                                    </div>
                                    {cycleRecord.bonus > 0 && (
                                        <div className="mt-3 text-sm text-emerald-400 flex items-center gap-1.5 bg-emerald-900/40 inline-flex px-3 py-1.5 rounded-md font-medium border border-emerald-500/20">
                                            <Icon name="gift" size={16}/> 
                                            כולל בונוס ע"ס {formatMoney(cycleRecord.bonus)} מהמועדון!
                                        </div>
                                    )}
                                </div>
                                <div className="text-left hidden sm:block opacity-30">
                                    <Icon name="dashboard" size={64} />
                                </div>
                            </div>
                            
                            <div className={`mt-4 rounded-2xl p-5 border ${rank.border} ${rank.bg} backdrop-blur flex justify-between items-center`}>
                                <div>
                                    <div className="text-[10px] text-slate-400 uppercase tracking-widest mb-1">סטטוס מועדון</div>
                                    <div className={`text-2xl font-black ${rank.color} tracking-wide`}>{rank.name} VIP</div>
                                </div>
                                <div className="text-left">
                                    <div className="text-[10px] text-slate-400 uppercase tracking-widest mb-1">ידיים שוחקו</div>
                                    <div className="text-2xl font-bold text-white">{cycleRecord.hands.toLocaleString()}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Table Details */}
                    {cycleRecord.tables && cycleRecord.tables.length > 0 && (
                        <div className="bg-slate-900/60 rounded-2xl p-6 border border-slate-800 shadow-lg">
                            <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-3">
                                פירוט משחקים
                            </h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-right text-slate-300">
                                    <thead className="border-b border-slate-700 bg-slate-800/50">
                                        <tr>
                                            <th className="p-3 text-slate-400 font-semibold rounded-tr-lg">שם שולחן / טורניר</th>
                                            <th className="p-3 text-slate-400 font-semibold">ידיים</th>
                                            <th className="p-3 text-slate-400 font-semibold rounded-tl-lg">תוצאה (P&L)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {cycleRecord.tables.map((t, idx) => (
                                            <tr key={idx} className="hover:bg-slate-800/50 transition-colors">
                                                <td className="p-3">{t.name}</td>
                                                <td className="p-3">{t.hands}</td>
                                                <td className={`p-3 font-bold ${getColorClass(t.pnl)}`}>{formatMoney(t.pnl)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* Inbox */}
                    <div className="bg-slate-900/60 rounded-2xl p-6 border border-slate-800 shadow-lg">
                        <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-3">
                            <Icon name="message" size={24} className="text-emerald-400"/> 
                            הודעות אישיות מהמועדון
                        </h3>
                        {myMessages.length === 0 ? (
                            <div className="text-center py-12 text-slate-500 bg-slate-800/30 rounded-xl border border-slate-800/50">
                                תיבת ההודעות שלך ריקה.
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {myMessages.map(msg => (
                                    <div key={msg.id} className="bg-slate-800/80 rounded-xl p-5 border border-slate-700/50 hover:border-emerald-500/30 transition-colors">
                                        <div className="flex justify-between items-center mb-3 border-b border-slate-700/50 pb-2">
                                            <div className="flex items-center gap-2">
                                                <div className="w-6 h-6 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500/50">
                                                    <span className="text-emerald-400 text-xs">♠</span>
                                                </div>
                                                <span className="font-bold text-slate-200 text-sm">הנהלת המועדון</span>
                                            </div>
                                            <span className="text-[10px] text-slate-500 font-medium tracking-wider">{msg.date}</span>
                                        </div>
                                        <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                        {msg.image && (
                                            <div className="mt-4 rounded-lg overflow-hidden border border-slate-700 inline-block shadow-md">
                                                <img src={msg.image} alt="Club" className="max-w-full h-auto max-h-48 object-cover" />
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
