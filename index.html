                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="space-y-5 bg-slate-900/50 p-6 rounded-2xl border border-slate-700/50">
                        <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-3"><Icon name="message" size={24} className="text-emerald-400"/> שליחת הודעת מערכת</h3>
                        <div><label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">נמען</label><select value={targetId} onChange={(e)=>setTargetId(e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded-xl p-3.5 text-white outline-none focus:border-emerald-500 shadow-inner font-medium"><option value="all">שידור לכולם (גלובלי)</option><optgroup label="סוכנים">{users.filter(u=>u.role==='agent').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</optgroup><optgroup label="שחקנים">{users.filter(u=>u.role==='player').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</optgroup></select></div>
                        <div><label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">תוכן ההודעה (קופץ באינבוקס)</label><textarea value={text} onChange={(e)=>setText(e.target.value)} rows="4" className="w-full bg-slate-800 border border-slate-600 rounded-xl p-4 text-white outline-none focus:border-emerald-500 shadow-inner resize-none" placeholder="הקלד את ההודעה שתקפוץ למשתמשים..."></textarea></div>
                        <div><label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">תמונה מצורפת (אופציונלי)</label><input type="text" value={imgUrl} onChange={(e)=>setImgUrl(e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded-xl p-3.5 text-white outline-none focus:border-emerald-500 shadow-inner" placeholder="הדבק URL של תמונה (https://...)" /></div>
                        <button onClick={sendMsg} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-transform active:scale-95 w-full mt-2">שגר הודעה</button>
                    </div>
                    <div className="bg-slate-900/80 rounded-2xl p-6 border border-slate-700/50 flex flex-col h-[600px] shadow-inner">
                        <h4 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 pb-3 border-b border-slate-700 flex items-center gap-2"><Icon name="dashboard" size={16}/> היסטוריית שידורים</h4>
                        <div className="space-y-4 overflow-y-auto flex-1 pr-2">
                            {messages.filter(m => m.senderId === 'admin1').map(m => (
                                <div key={m.id} className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm relative"><div className="flex justify-between items-start mb-3 border-b border-slate-700/50 pb-2"><span className="font-bold text-emerald-400 text-sm">נמען: {m.receiverId === 'all' ? 'כולם' : users.find(u=>u.id===m.receiverId)?.name || 'לא ידוע'}</span><span className="text-[10px] text-slate-500 font-medium">{m.date}</span></div><p className="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">{m.text}</p>{m.image && <img src={m.image} alt="Attachment" className="mt-3 rounded-lg border border-slate-600 max-h-40 object-cover shadow-md" />}</div>
                            ))}
                            {messages.length === 0 && (<div className="h-full flex flex-col items-center justify-center text-slate-500 opacity-50"><Icon name="message" size={48} className="mb-4" /><p>טרם נשלחו הודעות.</p></div>)}
                        </div>
                    </div>
                </div>
            );
        };

        const AgentDashboard = ({ user, users, records, currentCycle, showToast }) => {
            const [sortBy, setSortBy] = useState('pnl');
            const [expandedRow, setExpandedRow] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            const myPlayers = users.filter(u => u.agentId === user.id);
            
            const playerStats = useMemo(() => {
                const filtered = searchQuery ? myPlayers.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.username.toLowerCase().includes(searchQuery.toLowerCase())) : myPlayers;
                return filtered.map(player => {
                    const record = records.find(r => r.cycleId === currentCycle && r.playerId === player.id) || { pnl: 0, rake: 0, hands: 0, bonus: 0, tables: [] };
                    const rate = (player.customCommission !== null && player.customCommission !== undefined && player.customCommission !== '') ? Number(player.customCommission) : user.commissionRate;
                    const generatedCommissionNet = record.rake * (1 - SYSTEM_EXPENSES_RATE);
                    const agentCommission = generatedCommissionNet * (rate / 100);
                    return { ...player, ...record, generatedCommissionNet, calculatedCommission: agentCommission, finalPnl: record.pnl + (record.bonus || 0) };
                }).sort((a, b) => {
                    if (sortBy === 'pnl') return a.pnl - b.pnl;
                    if (sortBy === 'commission') return b.calculatedCommission - a.calculatedCommission;
                    if (sortBy === 'hands') return b.hands - a.hands;
                    return 0;
                });
            }, [myPlayers, records, currentCycle, user.commissionRate, sortBy, searchQuery]);

            const totalHands = playerStats.reduce((sum, p) => sum + p.hands, 0);
            const totalPnl = playerStats.reduce((sum, p) => sum + p.finalPnl, 0);
            const totalNetCommission = playerStats.reduce((sum, p) => sum + p.generatedCommissionNet, 0);
            const totalAgentCommission = playerStats.reduce((sum, p) => sum + p.calculatedCommission, 0);
            const totalAgainstClub = totalPnl + totalAgentCommission;

            const toggleRow = (id) => setExpandedRow(expandedRow === id ? null : id);

            return (
                <div className="space-y-6">
                    <div className="card-gradient rounded-2xl p-4 sm:p-8 border border-slate-700/50 shadow-2xl">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-6">
                            <div><h3 className="text-2xl font-black text-white">רשימת השחקנים שלי</h3><p className="text-slate-400 text-sm mt-1">לחץ על שחקן כדי לראות פירוט שולחנות וסיסמה.</p></div>
                            <div className="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                                <div className="relative w-full sm:w-64"><input type="text" placeholder="חיפוש שחקן..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-900/80 border border-slate-600 rounded-xl pl-4 pr-10 py-2.5 text-sm text-white outline-none focus:border-emerald-500 shadow-inner transition-colors"/><div className="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-500"><Icon name="search" size={18} /></div></div>
                                <div className="flex items-center gap-2 bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 w-full sm:w-auto shadow-inner"><Icon name="sort" size={18} className="text-slate-400"/><select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-transparent text-sm font-medium text-white outline-none cursor-pointer w-full"><option value="pnl">מיון: תוצאה (P&L)</option><option value="commission">מיון: עמלה</option><option value="hands">מיון: ידיים</option></select></div>
                            </div>
                        </div>

                        <div className="overflow-x-auto rounded-xl border border-slate-700/50 shadow-xl">
                            <table className="w-full text-right text-sm whitespace-nowrap">
                                <thead className="bg-slate-800 text-slate-300 uppercase text-[11px] tracking-widest">
                                    <tr>
                                        <th className="p-5 font-bold border-b border-slate-700 w-12 text-center">פירוט</th>
                                        <th className="p-5 font-bold border-b border-slate-700 text-right">כינוי השחקן</th>
                                        <th className="p-5 font-bold border-b border-slate-700 text-center">סה"כ ידיים</th>
                                        <th className="p-5 font-bold border-b border-slate-700 text-right">תוצאה (P&L)</th>
                                        <th className="p-5 font-bold border-b border-slate-700 text-right text-emerald-500">עמלה שייצר (נטו)</th>
                                        <th className="p-5 font-bold border-b border-slate-700 text-right text-emerald-400 bg-emerald-900/10">העמלה שלי</th>
                                        <th className="p-5 font-bold border-b border-slate-700 text-center w-16"></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700/50 bg-slate-900/30">
                                    {playerStats.map(stat => {
                                        const isWhale = Math.abs(stat.finalPnl) >= 5000;
                                        const isHot = stat.hands >= 3000;
                                        return (
                                        <Fragment key={stat.id}>
                                            <tr className={`transition-colors cursor-pointer group ${expandedRow === stat.id ? 'bg-slate-800' : 'hover:bg-slate-800/50'}`} onClick={() => toggleRow(stat.id)}>
                                                <td className="p-5 text-center text-slate-500 group-hover:text-emerald-400"><div className={`p-1.5 rounded-md inline-flex ${expandedRow === stat.id ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800'}`}>{expandedRow === stat.id ? <Icon name="chevronUp" size={16}/> : <Icon name="chevronDown" size={16}/>}</div></td>
                                                <td className="p-5 text-right">
                                                    <div className="font-bold text-white text-base flex items-center justify-start gap-2">
                                                        {isHot && <span title="פעיל מאוד! שוחקו המון ידיים">🔥</span>}
                                                        {isWhale && <span title="לוויתן! מעל 5000 שח רווח/הפסד">🐋</span>}
                                                        {stat.name}
                                                    </div>
                                                    <div className="text-[10px] text-slate-500 mt-1 uppercase tracking-wider">{stat.username}</div>
                                                </td>
                                                <td className="p-5 text-center font-medium text-slate-300">{stat.hands.toLocaleString()}</td>
                                                <td className={`p-5 text-right font-bold text-base money-value ${getColorClass(stat.finalPnl)}`}>{formatMoney(stat.finalPnl)}</td>
                                                <td className="p-5 text-right font-bold text-emerald-500/80 money-value">{formatMoney(stat.generatedCommissionNet)}</td>
                                                <td className="p-5 text-right font-black text-lg text-emerald-400 bg-emerald-900/5 money-value">{formatMoney(stat.calculatedCommission)}</td>
                                                <td className="p-5 text-center">
                                                    <a href={generateWhatsAppLink('', `היי ${stat.name},\nסיכום התחשבנות - מועדון NETABEL\nתוצאה סופית: ${formatMoney(stat.finalPnl)}\nסה"כ ידיים שוחקו: ${stat.hands}`)} target="_blank" onClick={(e)=>e.stopPropagation()} className="p-2 inline-block bg-slate-800 text-slate-400 hover:bg-emerald-600 hover:text-white rounded-full transition-colors" title="שלח לשחקן בוואטסאפ"><Icon name="whatsapp" size={16} /></a>
                                                </td>
                                            </tr>
                                            {expandedRow === stat.id && (
                                                <tr className="bg-slate-900"><td colSpan="7" className="p-0 border-b border-slate-800"><PlayerDetailsDrilldown player={stat} record={stat} finalPnl={stat.finalPnl} showToast={showToast} /></td></tr>
                                            )}
                                        </Fragment>
                                    )})}
                                </tbody>
                                <tfoot className="bg-slate-800/90 border-t-2 border-slate-600">
                                    <tr>
                                        <td colSpan="2" className="p-5 text-right font-black text-slate-300">סיכום סוכן (סה"כ):</td>
                                        <td className="p-5 text-center font-bold text-white">{totalHands.toLocaleString()}</td>
                                        <td className={`p-5 text-right font-bold text-lg money-value ${getColorClass(totalPnl)}`}>{formatMoney(totalPnl)}</td>
                                        <td className="p-5 text-right font-bold text-emerald-500/80 money-value">{formatMoney(totalNetCommission)}</td>
                                        <td colSpan="2" className="p-5 text-right font-black text-xl text-emerald-400 bg-emerald-900/20 money-value">{formatMoney(totalAgentCommission)}</td>
                                    </tr>
                                    <tr className="bg-slate-900 border-t border-slate-700">
                                        <td colSpan="4" className="p-6 text-right font-black text-slate-200 text-lg flex items-center gap-3"><div className="w-2 h-8 bg-cyan-500 rounded-full"></div>התחשבנות סופית מול מועדון (תוצאה + עמלה):</td>
                                        <td colSpan="3" className={`p-6 text-right text-3xl font-black tracking-tight money-value ${getColorClass(totalAgainstClub)}`}>{formatMoney(totalAgainstClub)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const PlayerDashboard = ({ user, records, messages, currentCycle }) => {
            const cycleRecord = records.find(r => r.cycleId === currentCycle && r.playerId === user.id) || { pnl: 0, hands: 0, bonus: 0, tables: [] };
            const finalResult = (cycleRecord.pnl || 0) + (cycleRecord.bonus || 0);
            const myMessages = messages.filter(m => m.receiverId === 'all' || m.receiverId === user.id);

            const getRank = (hands) => {
                if(hands > 10000) return { name: 'Titanium', color: 'text-purple-400', bg: 'bg-purple-900/20', border: 'border-purple-500/30' };
                if(hands > 5000) return { name: 'Gold', color: 'text-yellow-400', bg: 'bg-yellow-900/20', border: 'border-yellow-500/30' };
                if(hands > 1000) return { name: 'Silver', color: 'text-slate-300', bg: 'bg-slate-700/50', border: 'border-slate-500/50' };
                return { name: 'Bronze', color: 'text-orange-400', bg: 'bg-orange-900/20', border: 'border-orange-500/30' };
            };
            const rank = getRank(cycleRecord.hands || 0);

            return (
                <div className="max-w-4xl mx-auto space-y-8 mt-4">
                    <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 shadow-2xl p-8 sm:p-12 group">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-[80px] pointer-events-none transition-transform duration-700 group-hover:scale-110"></div>
                        <div className="absolute bottom-0 left-0 w-48 h-48 bg-cyan-500/10 rounded-full blur-[60px] pointer-events-none transition-transform duration-700 group-hover:scale-110"></div>
                        <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-8">
                            <div>
                                <h2 className="text-slate-400 text-xs font-bold tracking-[0.2em] uppercase mb-3 flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> יתרת מחזור מעודכנת</h2>
                                <div className={`text-6xl md:text-7xl font-black tracking-tight money-value ${getColorClass(finalResult)} drop-shadow-lg`}>{formatMoney(finalResult)}</div>
                                {cycleRecord.bonus > 0 && <div className="mt-4 text-sm text-emerald-400 flex items-center gap-2 bg-emerald-900/40 inline-flex px-4 py-2 rounded-lg font-bold border border-emerald-500/30 shadow-[0_0_15px_rgba(16,185,129,0.15)]"><Icon name="gift" size={16}/> בונוס מועדון מצורף: {formatMoney(cycleRecord.bonus)}</div>}
                            </div>
                            <div className="bg-slate-900/80 backdrop-blur-md rounded-2xl p-6 border border-slate-700 w-full md:w-64 shadow-xl">
                                <div className="text-[10px] text-slate-400 uppercase tracking-widest mb-1">סטטוס משתמש</div>
                                <div className={`text-3xl font-black ${rank.color} tracking-wide mb-4`}>{rank.name} <span className="text-sm">VIP</span></div>
                                <div className="flex justify-between items-center border-t border-slate-700/50 pt-3"><span className="text-xs text-slate-500 uppercase font-bold tracking-widest">ידיים שוחקו</span><span className="font-bold text-white text-lg">{cycleRecord.hands.toLocaleString()}</span></div>
                            </div>
                        </div>
                    </div>
                    {cycleRecord.tables && cycleRecord.tables.length > 0 && (
                        <div className="bg-slate-900/60 rounded-3xl p-6 md:p-8 border border-slate-800 shadow-xl relative overflow-hidden">
                            <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-3"><Icon name="dashboard" size={24} className="text-emerald-400"/> פירוט שולחנות וטורנירים</h3>
                            <div className="overflow-x-auto rounded-xl border border-slate-700/50">
                                <table className="w-full text-right text-sm">
                                    <thead className="bg-slate-800 text-slate-400 text-xs uppercase tracking-widest">
                                        <tr>
                                            <th className="p-4 font-bold border-b border-slate-700 text-right">שם שולחן / טורניר</th>
                                            <th className="p-4 font-bold border-b border-slate-700 text-center">סוג משחק</th>
                                            <th className="p-4 font-bold border-b border-slate-700 text-center">תאריכים</th>
                                            <th className="p-4 font-bold text-center border-b border-slate-700">ידיים</th>
                                            <th className="p-4 font-bold border-b border-slate-700 text-left">תוצאה (P&L)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700/50 bg-slate-900/30">
                                        {cycleRecord.tables.map((t, idx) => (
                                            <tr key={idx} className="hover:bg-slate-800/60 transition-colors">
                                                <td className="p-4 font-medium text-slate-200 text-base text-right">{t.name}</td>
                                                <td className="p-4 text-center text-slate-400">{t.gameType || '-'}</td>
                                                <td className="p-4 text-center text-slate-400 text-[11px]" dir="ltr">{t.date || '-'}</td>
                                                <td className="p-4 text-center text-slate-300 font-medium">{t.hands}</td>
                                                <td className={`p-4 font-bold text-lg text-left money-value ${getColorClass(t.pnl)}`}>{formatMoney(t.pnl)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot className="bg-slate-800/90 border-t-2 border-slate-600">
                                        <tr>
                                            <td colSpan="3" className="p-5 font-black text-slate-300 text-base text-right">סה"כ משחקים:</td>
                                            <td className="p-5 font-bold text-white text-center text-base">{cycleRecord.hands}</td>
                                            <td className={`p-5 font-black text-xl text-left money-value ${getColorClass(cycleRecord.pnl)}`}>{formatMoney(cycleRecord.pnl)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    )}
                    <div className="bg-slate-900/60 rounded-3xl p-6 md:p-8 border border-slate-800 shadow-xl">
                        <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-3"><Icon name="message" size={24} className="text-cyan-400"/> הודעות ממועדון NETABEL</h3>
                        {myMessages.length === 0 ? (
                            <div className="text-center py-16 text-slate-500 bg-slate-800/20 rounded-2xl border-2 border-dashed border-slate-700/50"><Icon name="message" size={48} className="mx-auto mb-4 opacity-50"/><p className="font-medium text-lg">תיבת ההודעות שלך ריקה.</p></div>
                        ) : (
                            <div className="space-y-5">
                                {myMessages.map(msg => (
                                    <div key={msg.id} className="bg-slate-800/80 rounded-2xl p-6 border border-slate-700 shadow-md hover:border-cyan-500/30 transition-colors">
                                        <div className="flex justify-between items-center mb-4 border-b border-slate-700/50 pb-3"><div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-cyan-500/20 flex items-center justify-center border border-cyan-500/50 shadow-[0_0_10px_rgba(6,182,212,0.2)]"><span className="text-cyan-400 text-sm font-black">N</span></div><span className="font-bold text-slate-100 text-base">הנהלת המועדון</span></div><span className="text-xs text-slate-500 font-bold tracking-widest bg-slate-900 px-3 py-1 rounded-full">{msg.date}</span></div>
                                        <p className="text-slate-300 text-base leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                        {msg.image && <div className="mt-5 rounded-xl overflow-hidden border border-slate-600 inline-block shadow-lg"><img src={msg.image} alt="Club" className="max-w-full h-auto max-h-64 object-cover" /></div>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
